spring.application.name=restaurante

# ── Base de datos H2 ─────────────────────────────────────────────
# Modo archivo: los datos se guardan en ./data/restaurante.mv.db (relativo a la carpeta
# desde donde se arranca la app) y sobreviven a reinicios.
# Para una BD que se borra al apagar la app, usar: jdbc:h2:mem:restaurante
spring.datasource.url=jdbc:h2:file:./data/restaurante
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Consola web para ver las tablas: http://localhost:8080/h2-console
# (JDBC URL: la misma de arriba, usuario sa, sin contraseña)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ──────────────────────────────────────────────
# update: crea las tablas que falten y agrega columnas nuevas; nunca borra datos.
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que genera Hibernate (útil para aprender; apagar en producción)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Las transacciones las maneja la capa Service; la vista (controller) no abre sesiones de BD
spring.jpa.open-in-view=false

# ── MongoDB (historial de pedidos) ───────────────────────────────
# Levantar Mongo con: docker compose up -d   (ver docker-compose.yml)
# Timeouts cortos: si Mongo está apagado, el historial falla en 2 s en vez de 30 s.
spring.data.mongodb.uri=mongodb://localhost:27017/restaurante?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000

# ── Seguridad (JWT) ───────────────────────────────────────────────
# Clave para firmar los tokens (Base64, mínimo 32 bytes). Quien la conozca puede fabricar tokens válidos.
# Se toma de la variable de entorno JWT_SECRET; el valor después de ":" es solo para desarrollo local.
# En producción: definir JWT_SECRET y no depender nunca de este valor por defecto.
jwt.secret=${JWT_SECRET:PUBJDxNFLO9LWnNdSh3qWooCYkTk4XPxAuNCDb+O+wbzbA3sEGewm0IIgv6jijIQ}
# Duración del token en milisegundos (86400000 = 24 horas)
jwt.expiration=86400000
# Crea al arrancar un usuario de prueba por rol (ver docs/SEGURIDAD.md). En producción: false
restaurante.seguridad.usuarios-demo=true

# ── CORS ─────────────────────────────────────────────────────────
# Frontends que pueden consumir la API desde el navegador (separados por coma)
restaurante.cors.origenes=http://localhost:5173,http://localhost:3000

# ── Reglas de negocio ────────────────────────────────────────────
# Reservas: horario en que se reciben y cuánto tiempo ocupa la mesa cada una
restaurante.reservas.hora-apertura=12:00
restaurante.reservas.hora-ultima-reserva=21:00
restaurante.reservas.duracion-minutos=120
# Parqueadero: cupos y tarifa por hora o fracción (en pesos)
restaurante.parqueadero.capacidad=20
restaurante.parqueadero.tarifa-hora-carro=5000
restaurante.parqueadero.tarifa-hora-moto=2000

# ── Swagger ──────────────────────────────────────────────────────
springdoc.override-with-generic-response=false
