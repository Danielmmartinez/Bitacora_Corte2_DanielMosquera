spring.application.name=restaurante

# Las pruebas usan una BD en memoria independiente: no tocan ./data/ y arrancan vacías
spring.datasource.url=jdbc:h2:mem:restaurante-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
springdoc.override-with-generic-response=false

# Seguridad en pruebas: clave fija de prueba (no es la de la app)
jwt.secret=cHJ1ZWJhcy1jbGF2ZS1zZWNyZXRhLWRlLTMyLWJ5dGVzLXBhcmEtaG1hYy1zaGEyNTY=
jwt.expiration=3600000
restaurante.seguridad.usuarios-demo=true
restaurante.cors.origenes=http://localhost:5173
