name: CI - Build, Test & Deploy QA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/restaurante-api

jobs:
  test:
    name: 🧪 Pruebas Unitarias e Integración
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Ejecutar pruebas y JaCoCo
        # Si tu pom.xml está dentro de la carpeta restaurante, busca y compila automáticamente
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean test --no-transfer-progress
          else
            cd restaurante && mvn clean test --no-transfer-progress
          fi

      - name: Subir reporte de JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "**/target/site/jacoco/"

  build-and-push:
    name: 🐳 Construir y Publicar Imagen Docker
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadatos de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=qa-
            type=raw,value=qa-latest

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          # Detecta si el Dockerfile está en la raíz o en /restaurante
          context: ${{ hashFiles('Dockerfile') != '' && '.' || 'restaurante' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-qa:
    name: 🚀 Desplegar en Azure QA
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Login a Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar contenedor en Web App QA
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_QA }}
          images: ${{ env.IMAGE_NAME }}:qa-latest

      - name: Configurar Variables de Entorno en Azure QA
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_QA }}
          app-settings-json: |
            [
              {"name": "SPRING_PROFILES_ACTIVE", "value": "docker"},
              {"name": "DB_HOST", "value": "${{ secrets.DB_HOST }}"},
              {"name": "DB_PORT", "value": "${{ secrets.DB_PORT }}"},
              {"name": "DB_NAME", "value": "${{ secrets.DB_NAME }}"},
              {"name": "DB_USER", "value": "${{ secrets.DB_USER }}"},
              {"name": "DB_PASSWORD", "value": "${{ secrets.DB_PASSWORD }}"},
              {"name": "MONGO_URI", "value": "${{ secrets.MONGO_URI }}"},
              {"name": "JWT_SECRET", "value": "${{ secrets.JWT_SECRET_QA }}"},
              {"name": "USUARIOS_DEMO", "value": "true"}
            ]
